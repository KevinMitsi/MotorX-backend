# ============================================================
# Perfil de PRODUCCIÓN - AWS
# Sobreescribe valores del application.yaml base
# Activar con: SPRING_PROFILES_ACTIVE=prod
# ============================================================

spring:
  jpa:
    show-sql: false                    # No mostrar SQL en producción
    properties:
      hibernate:
        format_sql: false
  datasource:
    url: jdbc:postgresql:///${DB_NAME}?cloudSqlInstance=${DB_HOST}&socketFactory=com.google.cloud.sql.postgres.SocketFactory&ipTypes=PRIVATE,PUBLIC
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 5
      connection-timeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
        application: motorx-backend

  security:
    debug: false                       # Deshabilitar debug de seguridad en producción

# ============================================================
# LOGGING - Reducido para producción
# ============================================================
logging:
  level:
    root: WARN
    com.sparktech.motorx: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
    org.flywaydb: INFO
    org.springframework.security: WARN
    org.springframework.security.web: WARN
    org.springframework.security.filter.FilterChainProxy: WARN
    org.springframework.security.authentication: WARN
    org.springframework.security.web.authentication: WARN
    org.springframework.security.web.access: WARN

chatbot:
  webhook-url: ${CHATBOT_WEBHOOK_URL:http://34.63.104.195:5678/webhook/webhook-chat}